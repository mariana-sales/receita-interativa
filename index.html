<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receita Interativa</title>
</head>
<body>
    <header>
        <h1>Tiramisu</h1>

        <p>
            Todo caseiro, do biscoito champanhe ao mascarpone.<br>Na primeira colherada você vai sacar que cada minuto preparando esta receita de tiramisu valeu a pena.
        </p>

        <img src="https://i.panelinha.com.br/i1/64-bk-4919-tiramisu-receita.webp" alt="Tiramisu">
    </header>

    <section>
        <button popovertarget="segredo">Ver o Segredo do Chef</button>

        <div id="segredo" popover>
            <h2>O segredo da receita</h2>

            <p>Uma pitada de páprica defumada no molho deixa o sabor muito mais intenso.</p>
        </div>
    </section>
</body>
</html>
